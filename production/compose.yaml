services:
  api:
    build: .
    env_file: .env
    environment:
      RADAR_DATA_DIR: /data
      RADAR_FRONTEND_DIR: /app/frontend_dist
    ports:
      - "127.0.0.1:18522:18522"
    volumes:
      - radar-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18522/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    env_file: .env
    environment:
      RADAR_DATA_DIR: /data
    command: ["python", "-m", "backend.worker"]
    volumes:
      - radar-data:/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  radar-data:
