name: Demo 2.0 CI

on:
  push:
    branches: [main, "release/**", "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-2.0.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-2.0.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v

      - name: Run Supabase adapter tests
        run: python -m unittest discover -s supabase/tests -v

      - name: Run acceptance tests
        run: python -m unittest discover -s tests -p "test_acceptance.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
